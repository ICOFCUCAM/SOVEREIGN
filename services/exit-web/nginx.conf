# SPA fallback so client-side routes (/console/buyers, /console/pipeline, …)
# resolve to index.html. When deployed behind a gateway that also fronts
# exit-api, uncomment the /v1 location so the browser stays same-origin and
# the token never leaves the first-party context.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # uncomment when co-deployed with exit-api behind one gateway:
  # location /v1/ { proxy_pass http://exit-api:8788; proxy_set_header Host $host; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
