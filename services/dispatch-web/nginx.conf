# SPA fallback so client-side routes (/review, /documents/:id, …) resolve to
# index.html. When deployed behind a gateway that also fronts dispatch-api, add
# a /v1 location that proxies to the API so the browser stays same-origin and
# no token ever leaves the first-party context.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # static assets with long cache; hashed filenames make this safe
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # uncomment when co-deployed with dispatch-api behind one gateway:
  # location /v1/ { proxy_pass http://dispatch-api:8787; proxy_set_header Host $host; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
