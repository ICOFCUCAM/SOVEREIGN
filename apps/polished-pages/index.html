<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Polished Pages — Create, Publish & Distribute Documents, Books & Educational Content</title>
    <meta name="description" content="Polished Pages is the AI platform to create CVs, cover letters, books, children's storybooks, workbooks and curricula — then publish to KDP and IngramSpark, translate into any language, and sell in the marketplace." />
    <meta name="author" content="Polished Pages" />

    <meta property="og:title" content="Polished Pages — The operating system for publishing & education" />
    <meta property="og:description" content="Create CVs, books, storybooks, workbooks and curricula with AI — then localize, publish to KDP and IngramSpark, and sell in the marketplace." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Polished Pages" />
    <meta property="og:image" content="/og.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Polished Pages — The operating system for publishing & education" />
    <meta name="twitter:description" content="Create, localize, publish, distribute and sell — the whole journey in one platform." />
    <meta name="twitter:image" content="/og.svg" />

    <link rel="canonical" href="https://sovereigndo.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Polished Pages",
        "url": "https://sovereigndo.com",
        "logo": "https://sovereigndo.com/icon.svg",
        "description": "The operating system for publishing and educational creation — create CVs, books, storybooks, workbooks and curricula, then localize, publish and sell."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("pp_theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0a0f1d");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
