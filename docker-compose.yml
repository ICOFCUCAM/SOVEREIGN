# Sovereign Dispatch — dedicated, self-contained infrastructure (R3 + R4).
#
# Brings up Dispatch on its OWN Postgres (not the Polished Pages Supabase
# project), applies migrations with the Dispatch-owned runner, then starts the
# API and worker. This entire stack has zero dependency on the Polished Pages
# SPA or its Supabase project — it is what proves Dispatch can outlive an
# archived Polished Pages.
#
#   docker compose up --build
#   curl localhost:8787/v1/health
#
# NOTE: secrets below are dev defaults — override for any real deployment.

services:
  dispatch-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dispatch
    command: ["postgres", "-c", "shared_preload_libraries="]
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatch"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dispatch-pgdata:/var/lib/postgresql/data

  dispatch-migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DISPATCH_MIGRATE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@dispatch-db:5432/dispatch
      DISPATCH_APP_PASSWORD: ${DISPATCH_APP_PASSWORD:-dispatch_app}
      DISPATCH_PURGE_PASSWORD: ${DISPATCH_PURGE_PASSWORD:-dispatch_purge}
    depends_on:
      dispatch-db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql "$$DISPATCH_MIGRATE_URL" -c "create extension if not exists pgcrypto" &&
        node db/migrate.mjs up &&
        psql "$$DISPATCH_MIGRATE_URL" -c "alter role dispatch_app with login password '$$DISPATCH_APP_PASSWORD'" &&
        psql "$$DISPATCH_MIGRATE_URL" -c "alter role dispatch_purge with login password '$$DISPATCH_PURGE_PASSWORD'"

  dispatch-api:
    build:
      context: .
      dockerfile: services/dispatch-api/Dockerfile
    environment:
      NODE_ENV: production
      PGHOST: dispatch-db
      PGPORT: "5432"
      PGDATABASE: dispatch
      DISPATCH_DB_USER: dispatch_app
      PGPASSWORD: ${DISPATCH_APP_PASSWORD:-dispatch_app}
      DISPATCH_TOKEN_SECRET: ${DISPATCH_TOKEN_SECRET:-dev-dispatch-token-secret-change-me}
      DISPATCH_TOKEN_ISSUER: sovereign-dispatch
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Storage — MUST match the worker (same backend + creds) so the API can
      # read what the worker wrote. fs backend shares the dispatch-artifacts volume.
      DISPATCH_STORAGE_BACKEND: ${DISPATCH_STORAGE_BACKEND:-fs}
      DISPATCH_STORAGE_DIR: /artifacts
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - dispatch-artifacts:/artifacts
    depends_on:
      dispatch-migrate:
        condition: service_completed_successfully

  dispatch-worker:
    build:
      context: .
      dockerfile: services/dispatch-worker/Dockerfile
    environment:
      NODE_ENV: production
      PGHOST: dispatch-db
      PGPORT: "5432"
      PGDATABASE: dispatch
      DISPATCH_DB_USER: dispatch_app
      PGPASSWORD: ${DISPATCH_APP_PASSWORD:-dispatch_app}
      # Worker mints/uses the same token secret for callback HMAC + must agree
      # with the API on grant verification if it ever serves; harmless to share.
      DISPATCH_TOKEN_SECRET: ${DISPATCH_TOKEN_SECRET:-dev-dispatch-token-secret-change-me}
      DISPATCH_TOKEN_ISSUER: sovereign-dispatch
      CALLBACK_HMAC_SECRET: ${CALLBACK_HMAC_SECRET:-}
      # Storage: default fs backend shares a volume with the API so artifact
      # bytes the worker writes are readable by the API on GET. For production
      # set DISPATCH_STORAGE_BACKEND=s3 + S3_* on BOTH services and drop the volume.
      DISPATCH_STORAGE_BACKEND: ${DISPATCH_STORAGE_BACKEND:-fs}
      DISPATCH_STORAGE_DIR: /artifacts
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    volumes:
      - dispatch-artifacts:/artifacts
    depends_on:
      dispatch-migrate:
        condition: service_completed_successfully

  # Retention sweeper — archives published docs past retention_until and expires
  # (purges) artifact bytes past the grace window. Runs as the privileged
  # dispatch_purge role (BYPASSRLS); never deletes documents or audit.
  dispatch-retention:
    build:
      context: .
      dockerfile: services/dispatch-worker/Dockerfile
    command: ["node", "src/retention.mjs"]
    environment:
      NODE_ENV: production
      PGHOST: dispatch-db
      PGPORT: "5432"
      PGDATABASE: dispatch
      DISPATCH_PURGE_USER: dispatch_purge
      DISPATCH_PURGE_PASSWORD: ${DISPATCH_PURGE_PASSWORD:-dispatch_purge}
      DISPATCH_PURGE_GRACE_DAYS: ${DISPATCH_PURGE_GRACE_DAYS:-30}
      DISPATCH_RETENTION_INTERVAL_MS: ${DISPATCH_RETENTION_INTERVAL_MS:-3600000}
    depends_on:
      dispatch-migrate:
        condition: service_completed_successfully

  # The Dispatch console (standalone SPA). Built with the API URL baked in and
  # served by nginx. Separate deployable from the Sovereign website; in this
  # single-host compose it is reached directly and calls the API on :8787.
  dispatch-web:
    build:
      context: services/dispatch-web
      dockerfile: Dockerfile
      args:
        VITE_DISPATCH_API_URL: ${VITE_DISPATCH_API_URL:-http://localhost:8787}
    ports:
      - "5174:80"
    depends_on:
      - dispatch-api

volumes:
  dispatch-pgdata:
  dispatch-artifacts:
